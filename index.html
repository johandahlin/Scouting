<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="DERT #2040 Strategy Team">
<meta name="created" content="2026-10-20">
<meta name="version" content="1.0">
<title>DERT #2040 Match Scouting</title>
<link rel="icon" href="logo.png">
<!-- iPhone "Add to Home Screen" support -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DERT Scout">
<meta name="theme-color" content="#1c1c1c">
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700|Roboto+Serif:700,900&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<style>
  /* Colors taken from dert2040.org */
  :root {
    --dark: #1c1c1c; --light: #f9f9f9; --teal: #12b4af; --teal-dark: #0e8f8b;
    --card: #fff; --text: #1c1c1c; --muted: rgba(28,28,28,.62); --border: rgba(28,28,28,.16);
    --red: #d63a3a; --blue: #1f6fd1; --warn: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--light); color: var(--text);
    font: 16px/1.5 Roboto, Arial, sans-serif;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--dark); color: var(--light);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; border-bottom: 4px solid var(--teal);
  }
  header .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header img { width: 46px; height: 46px; }
  header h1 { margin: 0; font: 900 1.25rem/1.15 "Roboto Serif", Georgia, serif; }
  header .sub { color: var(--teal); font-weight: 500; font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; }
  header nav { margin-left: auto; display: flex; gap: 14px; font-size: .85rem; }
  header nav a { color: #7fe0dc; font-weight: 500; text-decoration: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--teal);
    border-radius: 10px; padding: 14px 14px 4px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 {
    font: 700 1.15rem "Roboto Serif", Georgia, serif; margin: 0 0 12px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card h2 small { font: 500 .8rem Roboto, Arial, sans-serif; color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; }
  .grid > .full { grid-column: 1 / -1; }
  .row { margin-bottom: 14px; min-width: 0; }
  .field { display: block; font-weight: 500; margin-bottom: 6px; }
  .field .req { color: var(--warn); }
  .hint { font-size: .8rem; color: var(--muted); margin: -2px 0 6px; }

  input[type=text], input[type=number], textarea {
    width: 100%; min-width: 0; padding: 11px 12px; font: inherit; color: var(--text); background: var(--light);
    border: 1px solid var(--border); border-radius: 6px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,180,175,.25); }
  textarea { min-height: 96px; resize: vertical; }
  .invalid input, .invalid .opts { box-shadow: 0 0 0 2px var(--warn); border-radius: 6px; }

  /* Single-select and multi-select buttons */
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    flex: 1 1 auto; min-width: 54px; padding: 10px 8px; text-align: center;
    background: transparent; border: 2px solid var(--teal); border-radius: 6px;
    font: 500 .95rem Roboto, Arial, sans-serif; color: var(--teal-dark); cursor: pointer; user-select: none;
  }
  .opt.on { background: var(--teal); color: var(--dark); }
  .multi .opt.on::before { content: "✓ "; }
  .opt.red  { border-color: var(--red);  color: var(--red); }
  .opt.red.on  { background: var(--red);  color: #fff; }
  .opt.blue { border-color: var(--blue); color: var(--blue); }
  .opt.blue.on { background: var(--blue); color: #fff; }

  /* Counters */
  .counter { display: flex; align-items: stretch; gap: 6px; }
  .counter .val {
    min-width: 58px; display: flex; align-items: center; justify-content: center;
    font: 700 1.6rem Roboto, Arial, sans-serif; background: var(--light); border: 1px solid var(--border); border-radius: 6px;
  }
  .counter button {
    flex: 1; padding: 12px 0; font: 700 1.05rem Roboto, Arial, sans-serif; border-radius: 6px; cursor: pointer;
    border: 2px solid var(--teal); background: var(--teal); color: var(--dark); touch-action: manipulation;
  }
  .counter button.minus { flex: 0 0 52px; background: transparent; color: var(--teal-dark); }
  .counter button:active { transform: scale(.96); }

  .btn {
    width: 100%; padding: 14px; font: 700 1.05rem Roboto, Arial, sans-serif; letter-spacing: .03em;
    border: 2px solid var(--teal); border-radius: 6px; background: var(--teal); color: var(--dark); cursor: pointer;
    margin-bottom: 10px;
  }
  .btn.secondary { background: transparent; color: var(--teal-dark); }
  .error { color: var(--warn); font-weight: 500; margin: 0 0 12px; }

  .score { display: flex; gap: 8px; margin-bottom: 14px; }
  .score div { flex: 1; background: var(--dark); color: var(--light); border-radius: 6px; padding: 8px; text-align: center; }
  .score b { display: block; font-size: 1.3rem; color: var(--teal); }
  .score span { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }

  #result { text-align: center; padding-bottom: 14px; }
  #qr svg { width: 100%; max-width: 340px; height: auto; }
  .summary { text-align: left; font-size: .85rem; color: var(--muted); word-break: break-word; }
  .summary b { color: var(--text); font-weight: 500; }
  details { text-align: left; margin-top: 8px; font-size: .85rem; }
  details pre { white-space: pre-wrap; word-break: break-all; background: var(--light); padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <img src="logo.png" alt="DERT logo">
    <div>
      <h1>DERT #2040</h1>
      <div class="sub">REBUILT Match Scouting</div>
    </div>
    <nav><a href="matches.html">Matches</a><a href="dashboard.html">Dashboard</a></nav>
  </div>
</header>

<div class="wrap">
  <form id="form" novalidate>
    <div id="sections"></div>
    <div class="score" id="score"></div>
    <div id="error" class="error" hidden></div>
    <button type="submit" class="btn">Submit &amp; show QR</button>
    <button type="button" class="btn secondary" id="clear">Clear form</button>
  </form>

  <div id="result" class="card" hidden>
    <h2>Scan me</h2>
    <div id="qr"></div>
    <p class="summary" id="summary"></p>
    <button type="button" class="btn" id="next">Next match</button>
    <button type="button" class="btn secondary" id="edit">Back to edit</button>
    <details>
      <summary>Excel column headers</summary>
      <p>Paste this as row 1 in your Excel sheet (once per event).</p>
      <pre id="headers"></pre>
      <button type="button" class="btn secondary" id="copyHeaders">Copy headers</button>
    </details>
  </div>
</div>

<script>
  // Offline support (only works when served over https, e.g. GitHub Pages)
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  /*
   * FORM DEFINITION - edit here to add, remove or rename fields.
   * The order below is the column order in Excel.
   *   type: number | text | textarea | select (pick one) | multi (pick any) | counter
   *   keep: true  -> value stays when you press "Next match"
   *   half: true  -> field takes half the width
   *   col:        -> Excel column header (defaults to label; must be unique)
   * If you add/remove/reorder fields, update the Excel workbook columns to match.
   */
  const SECTIONS = [
    { title: "Pre-Match", fields: [
      { id: "matchType", label: "Match type", type: "select", options: ["Practice", "Qual", "Playoff"], def: "Qual", keep: true },
      { id: "match",    label: "Match #", type: "number", required: true, half: true },
      { id: "team",     label: "Team #",  type: "number", required: true, half: true },
      { id: "alliance", label: "Alliance", type: "select", options: ["Red", "Blue"], required: true, keep: true, half: true },
      { id: "station",  label: "Station", type: "select", options: ["1", "2", "3"], keep: true, half: true },
      { id: "scout",    label: "Scout name", type: "text", required: true, keep: true },
      { id: "showed",   label: "Robot on field?", type: "select", options: ["Yes", "No show"], def: "Yes" },
      { id: "startPos", label: "Starting position", type: "select", options: ["Left", "Center", "Right"],
        hint: "As seen from your alliance's driver station" },
      { id: "preload",  label: "Fuel preloaded", type: "counter", max: 8, steps: [1] },
    ]},
    { title: "Autonomous", note: "20 sec", fields: [
      { id: "autoFuel", label: "Fuel scored", col: "Auto fuel scored", type: "counter", steps: [1, 5, 10] },
      { id: "autoMiss", label: "Fuel missed", col: "Auto fuel missed", type: "counter", steps: [1, 5] },
      { id: "autoMoves", label: "Auto path", type: "multi",
        options: ["Left start line", "Went to Neutral Zone", "Crossed Bump", "Used Trench"] },
      { id: "autoIntake", label: "Picked up fuel from", type: "multi", options: ["Depot", "Neutral Zone", "Outpost"] },
      { id: "autoClimb", label: "Tower climb in auto", type: "select", options: ["None", "Attempted", "Level 1"], def: "None",
        hint: "Level 1 = 15 pts" },
    ]},
    { title: "Teleop", note: "2:20", fields: [
      { id: "teleFuel", label: "Fuel scored (active Hub)", col: "Teleop fuel scored", type: "counter", steps: [1, 5, 10],
        hint: "Only fuel that goes in while your Hub is active counts" },
      { id: "teleMiss", label: "Fuel missed", col: "Teleop fuel missed", type: "counter", steps: [1, 5] },
      { id: "intake",   label: "Intake from", type: "multi",
        options: ["Neutral Zone floor", "Alliance Zone floor", "Depot", "Outpost / Human Player"] },
      { id: "shootFrom", label: "Shoots from", type: "multi", options: ["Close to Hub", "Mid range", "Long range", "While moving"] },
      { id: "terrain",  label: "Drives over / through", type: "multi", options: ["Bump", "Trench"] },
      { id: "inactive", label: "When Hub is inactive the robot…", col: "Inactive Hub behavior", type: "multi",
        options: ["Collects / stockpiles", "Passes fuel to our zone", "Plays defense", "Shoots anyway", "Idle"] },
      { id: "capacity", label: "Fuel it can carry", type: "select", options: ["1–10", "11–25", "26–40", "40+"] },
      { id: "defense",  label: "Played defense", type: "select", options: ["None", "Some", "A lot"], def: "None", half: true },
      { id: "defended", label: "Was defended", type: "select", options: ["No", "Some", "Heavily"], def: "No", half: true },
    ]},
    { title: "Endgame", note: "last 30 sec", fields: [
      { id: "climb", label: "Tower climb", type: "select", options: ["None", "Attempted", "Level 1", "Level 2", "Level 3"], def: "None",
        hint: "L1 = 10 · L2 = 20 · L3 = 30 pts" },
      { id: "climbTime", label: "Climb time", type: "select", options: ["Under 5 s", "5–10 s", "10–20 s", "Over 20 s"] },
    ]},
    { title: "Post-Match", fields: [
      { id: "driver",   label: "Driver skill (1 = poor, 5 = great)", col: "Driver skill", type: "select", options: ["1", "2", "3", "4", "5"] },
      { id: "speed",    label: "Robot speed", type: "select", options: ["1", "2", "3", "4", "5"] },
      { id: "accuracy", label: "Shooting accuracy", type: "select", options: ["1", "2", "3", "4", "5"] },
      { id: "issues",   label: "Problems", type: "multi",
        options: ["Died / disabled", "Lost comms", "Tipped over", "Broke mechanism", "Fuel jam", "Stuck on Bump"] },
      { id: "minorFouls", label: "Minor fouls", type: "counter", steps: [1], half: true },
      { id: "majorFouls", label: "Major fouls", type: "counter", steps: [1], half: true },
      { id: "card",     label: "Card", type: "select", options: ["None", "Yellow", "Red"], def: "None" },
      { id: "pick",     label: "Would you pick this robot?", col: "Pick?", type: "select", options: ["Yes", "Maybe", "No"] },
      { id: "notes",    label: "Observations", type: "textarea", placeholder: "Strengths, weaknesses, strategy, anything unusual…" },
    ]},
  ];

  // Point values from the 2026 REBUILT game manual
  const AUTO_CLIMB_PTS = { "Level 1": 15 };
  const TELE_CLIMB_PTS = { "Level 1": 10, "Level 2": 20, "Level 3": 30 };

  const FIELDS = SECTIONS.flatMap(s => s.fields);
  const DRAFT_KEY = "dertScoutDraft";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let data = {};

  function defaults(keepFrom) {
    const d = {};
    FIELDS.forEach(f => {
      if (keepFrom && f.keep) d[f.id] = keepFrom[f.id];
      else if (f.type === "counter") d[f.id] = 0;
      else if (f.type === "multi") d[f.id] = [];
      else d[f.id] = f.def || "";
    });
    return d;
  }

  // ---------- rendering ----------
  function fieldHtml(f) {
    const label = `<span class="field">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ""}</span>` +
                  (f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "");
    let input = "";
    const v = data[f.id];
    if (f.type === "number" || f.type === "text") {
      input = `<input type="${f.type}" data-id="${f.id}" value="${esc(v)}" ${f.type === "number" ? 'inputmode="numeric" min="0"' : ""}>`;
    } else if (f.type === "textarea") {
      input = `<textarea data-id="${f.id}" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`;
    } else if (f.type === "select" || f.type === "multi") {
      input = `<div class="opts ${f.type}">` + f.options.map(o => {
        const on = f.type === "multi" ? v.includes(o) : v === o;
        const color = f.id === "alliance" ? " " + o.toLowerCase() : "";
        return `<button type="button" class="opt${color}${on ? " on" : ""}" data-id="${f.id}" data-opt="${esc(o)}">${esc(o)}</button>`;
      }).join("") + `</div>`;
    } else if (f.type === "counter") {
      input = `<div class="counter"><button type="button" class="minus" data-id="${f.id}" data-step="-1">−</button>` +
              `<div class="val" id="val-${f.id}">${v}</div>` +
              f.steps.map(s => `<button type="button" data-id="${f.id}" data-step="${s}">+${s}</button>`).join("") + `</div>`;
    }
    return `<div class="row${f.half ? "" : " full"}" id="row-${f.id}">${label}${input}</div>`;
  }

  function render() {
    $("sections").innerHTML = SECTIONS.map(s => `
      <section class="card">
        <h2>${esc(s.title)}${s.note ? `<small>${esc(s.note)}</small>` : ""}</h2>
        <div class="grid">${s.fields.map(fieldHtml).join("")}</div>
      </section>`).join("");
    updateScore();
  }

  function rerenderField(id) {
    const f = FIELDS.find(x => x.id === id);
    $("row-" + id).outerHTML = fieldHtml(f);
  }

  // ---------- scoring ----------
  function points() {
    const auto = data.autoFuel + (AUTO_CLIMB_PTS[data.autoClimb] || 0);
    const tele = data.teleFuel;
    const climb = TELE_CLIMB_PTS[data.climb] || 0;
    return { auto, tele, climb, total: auto + tele + climb };
  }

  function updateScore() {
    const p = points();
    $("score").innerHTML = [["Auto", p.auto], ["Teleop", p.tele], ["Climb", p.climb], ["Total", p.total]]
      .map(([l, n]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");
  }

  // ---------- state ----------
  function save() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e) {} }

  function load() {
    data = defaults();
    try {
      const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (saved) FIELDS.forEach(f => { if (f.id in saved) data[f.id] = saved[f.id]; });
    } catch (e) {}
  }

  // ---------- events ----------
  $("form").addEventListener("click", e => {
    const b = e.target.closest("button[data-id]");
    if (!b) return;
    const id = b.dataset.id, f = FIELDS.find(x => x.id === id);
    if (b.dataset.step) {
      const max = f.max ?? Infinity;
      data[id] = Math.min(max, Math.max(0, data[id] + Number(b.dataset.step)));
      $("val-" + id).textContent = data[id];
    } else if (f.type === "multi") {
      const o = b.dataset.opt, list = data[id];
      data[id] = list.includes(o) ? list.filter(x => x !== o) : [...list, o];
      b.classList.toggle("on");
    } else {
      data[id] = data[id] === b.dataset.opt ? "" : b.dataset.opt;  // tap again to unselect
      rerenderField(id);
    }
    $("row-" + id).classList.remove("invalid");
    updateScore();
    save();
  });

  $("form").addEventListener("input", e => {
    const id = e.target.dataset.id;
    if (!id) return;
    data[id] = e.target.value;
    $("row-" + id).classList.remove("invalid");
    save();
  });

  // Tabs/newlines would break the Excel row, so flatten them
  const clean = s => String(s).replace(/[\t\r\n]+/g, " ").trim();

  function columns() {
    const p = points();
    const cols = FIELDS.map(f => [f.col || f.label, clean(Array.isArray(data[f.id]) ? data[f.id].join("; ") : data[f.id])]);
    cols.push(["Auto pts", p.auto], ["Teleop fuel pts", p.tele], ["Climb pts", p.climb], ["Total pts", p.total],
              ["Submitted", new Date().toLocaleString()]);
    return cols;
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const missing = FIELDS.filter(f => f.required && !String(data[f.id]).trim());
    missing.forEach(f => $("row-" + f.id).classList.add("invalid"));
    if (missing.length) {
      $("error").textContent = "Please fill in: " + missing.map(f => f.label).join(", ");
      $("error").hidden = false;
      $("row-" + missing[0].id).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    $("error").hidden = true;

    // Tab-separated: a scanner in keyboard mode types each value into the next Excel cell,
    // and the trailing newline (Enter) moves to the next row.
    const cols = columns();
    const payload = cols.map(c => c[1]).join("\t") + "\n";

    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    const qr = qrcode(0, "L");
    qr.addData(payload, "Byte");
    qr.make();
    $("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });

    $("summary").innerHTML = `<b>Match ${esc(data.match)} · Team ${esc(data.team)} · ${esc(data.alliance)} ${esc(data.station)}</b><br>` +
      cols.slice(6).filter(c => c[1] !== "" && c[1] !== 0).map(c => `${esc(c[0])}: ${esc(c[1])}`).join(" | ");
    $("headers").textContent = cols.map(c => c[0]).join("\t");

    $("form").hidden = true;
    $("result").hidden = false;
    window.scrollTo(0, 0);
  });

  // Next match: keep scout/alliance/station, bump match number, clear the rest
  $("next").addEventListener("click", () => {
    const nextMatch = (parseInt(data.match, 10) || 0) + 1;
    data = defaults(data);
    data.match = String(nextMatch);
    save(); render();
    $("result").hidden = true;
    $("form").hidden = false;
    window.scrollTo(0, 0);
  });

  $("edit").addEventListener("click", () => {
    $("result").hidden = true;
    $("form").hidden = false;
  });

  // Two taps to clear, so a stray tap doesn't wipe a match
  $("clear").addEventListener("click", e => {
    const b = e.target;
    if (b.dataset.armed) {
      data = defaults(data);
      save(); render();
      window.scrollTo(0, 0);
      delete b.dataset.armed; b.textContent = "Clear form";
    } else {
      b.dataset.armed = "1"; b.textContent = "Tap again to clear";
      setTimeout(() => { delete b.dataset.armed; b.textContent = "Clear form"; }, 3000);
    }
  });

  $("copyHeaders").addEventListener("click", e => {
    navigator.clipboard?.writeText($("headers").textContent)
      .then(() => e.target.textContent = "Copied!")
      .catch(() => e.target.textContent = "Copy failed – select the text above");
  });

  load();
  render();
</script>
</body>
</html>
